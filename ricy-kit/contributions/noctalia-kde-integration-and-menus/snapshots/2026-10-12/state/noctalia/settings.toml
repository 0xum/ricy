config_version = 14

[bar]
order = [ "search_edge", "default" ]

    [bar.default]
    capsule = true
    capsule_border_width = 0.0
    capsule_opacity = 0.69999998435378075
    capsule_thickness = 0.69999998807907104
    center = [ "clock" ]
    contact_shadow = true
    end = [ "tray", "bar", "widget", "volume", "network", "control-center", "widget_2" ]
    font_family = "JetBrainsMono Nerd Font"
    font_scale = 0.99999998509883881
    scale = 1.2500000111758709
    thickness = 42

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = [
    "desktop-widget-0000000000000001",
    "desktop-widget-0000000000000002",
    "desktop-widget-0000000000000003",
    "desktop-widget-0000000000000004"
]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 112.0
    box_width = 240.0
    cx = 184.0
    cy = 84.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background_color = "on_primary"
        background_opacity = 0.5
        background_radius = 6
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
