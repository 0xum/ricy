    cy = 184.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        background_color = "on_primary"
        background_opacity = 0.5

[hot_corners.bottom_left]
action = "command"

[hot_corners.top_right]
action = "control_center"

[location]
address = "Cosmopolis, Sao Paulo, Brazil"
auto_locate = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.00006103515625
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
enabled = true

[plugin_settings."aabidk20/yt-music"]
panel_position = "center"

[plugin_settings."riversyx/noctaproton-vpn"]
panel_placement = "floating"

[plugins]
enabled = [ "riversyx/noctaproton-vpn", "lucasoe/proton-pass", "aabidk20/yt-music", "yuuto/arch-updater" ]

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 1.0000000149011612
input_borders = false
lang = "en"
popup_borders = false

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
custom_palette = "KDE-Atual"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]
    community_ids = [ "vscode" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper.default]
path = "/usr/local/share/ricy/limine-splash.png"

[wallpaper.last]
path = "/usr/local/share/ricy/limine-splash.png"

[wallpaper.monitors.DP-1]
path = "/usr/local/share/ricy/limine-splash.png"

[wallpaper.monitors.HDMI-A-1]
path = "/usr/local/share/ricy/limine-splash.png"

[weather]
enabled = true
unit = "metric"

[widget.bar]
type = "riversyx/noctaproton-vpn:bar"

[widget.taskbar]
app_order = [ "14:github desktop:0", "13:brave-browser:0", "7:chatgpt:0", "15:org.kde.konsole:0", "13:brave-browser:1" ]

[widget.widget]
type = "aabidk20/yt-music:widget"

[widget.widget_2]
hide_on_empty = true
type = "yuuto/arch-updater:widget"